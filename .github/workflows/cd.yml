name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches: [ main ]

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install kubectl
      uses: azure/setup-kubectl@v1

    - name: Set Kubernetes context
      uses: azure/k8s-set-context@v1
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy Database
      run: |
        kubectl apply -f k8s/secrets/
        kubectl apply -f k8s/storage/
        kubectl apply -f k8s/postgres/
        echo "Waiting for PostgreSQL to be ready..."
        kubectl wait --for=condition=ready pod -l app=postgres --timeout=300s

    - name: Deploy Application
      run: |
        # Update the deployment image with the new version
        kubectl set image deployment/screenshot-app screenshot-app=${{ secrets.DOCKER_HUB_USERNAME }}/screenshot-app:${{ github.sha }}
        kubectl apply -f k8s/application/
        echo "Waiting for application to be ready..."
        kubectl wait --for=condition=ready pod -l app=screenshot-app --timeout=300s

    - name: Verify Deployment
      run: |
        kubectl get pods
        kubectl get services
        kubectl get ingress 